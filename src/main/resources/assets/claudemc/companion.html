<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaudeMC Companion</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a12;
      --surface:   #12121e;
      --surface2:  #1a1a2e;
      --border:    #2a2a40;
      --accent:    #4ADE80;
      --secondary: #6366f1;
      --text:      #eeeeee;
      --text-dim:  #888899;
      --red:       #f87171;
      --orange:    #fb923c;
      --yellow:    #facc15;
      --grey:      #6b7280;
      --blue:      #3b82f6;
      --radius:    6px;
      --font:      'Courier New', Courier, monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: var(--accent); }
    button { cursor: pointer; font-family: var(--font); }

    /* ===== LAYOUT ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #header h1 {
      font-size: 16px;
      color: var(--accent);
      letter-spacing: 1px;
    }
    /* Status dot */
    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--grey);
      transition: background 0.4s;
      flex-shrink: 0;
    }
    #status-dot.online  { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    #status-dot.offline { background: var(--red); }

    /* ===== TAB STRIP ===== */
    #tab-strip {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 10px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-dim);
      font-size: 13px;
      letter-spacing: 0.5px;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ===== TAB CONTENT ===== */
    #tab-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tab-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: auto;
      padding: 16px;
    }
    .tab-panel.active { display: flex; }

    /* ===== SHARED COMPONENTS ===== */
    .section-title {
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Inputs / selects / textareas */
    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input[type="checkbox"] { width: auto; accent-color: var(--accent); cursor: pointer; }
    textarea { resize: vertical; }
    select option { background: var(--surface2); }

    /* Buttons */
    .btn {
      padding: 6px 14px;
      border-radius: var(--radius);
      border: none;
      font-size: 13px;
      font-weight: bold;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary  { background: var(--accent);    color: #000; }
    .btn-secondary{ background: var(--secondary); color: #fff; }
    .btn-ghost    { background: var(--border);    color: var(--text); }
    .btn-danger   { background: var(--red);       color: #fff; }
    .btn-sm { padding: 3px 9px; font-size: 12px; }

    /* Filter row */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .filter-row label { color: var(--text-dim); font-size: 12px; }

    /* Status bar */
    .status-bar {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 8px;
      min-height: 18px;
    }
    .status-bar .hl { color: var(--accent); font-weight: bold; }
    .status-bar .vuln-hl { color: var(--red); font-weight: bold; }

    /* Tables */
    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .results-table th {
      background: var(--surface2);
      color: var(--text-dim);
      text-align: left;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .results-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .results-table tr:hover > td { background: rgba(255,255,255,0.03); }

    /* Expanded row */
    .expanded-row td {
      background: var(--surface2) !important;
      padding: 12px 16px;
    }
    .expanded-content {
      font-size: 12px;
      line-height: 1.6;
    }
    .expanded-content h4 { color: var(--accent); margin-bottom: 6px; }
    .expanded-content pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Vulnerability badges */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
      margin: 1px 2px 1px 0;
    }
    .badge-CRITICAL { background: rgba(248,113,113,0.15); color: var(--red);    border: 1px solid var(--red); }
    .badge-HIGH     { background: rgba(251,146,60,0.15);  color: var(--orange); border: 1px solid var(--orange); }
    .badge-MEDIUM   { background: rgba(250,204,21,0.15);  color: var(--yellow); border: 1px solid var(--yellow); }
    .badge-PATCHED  { background: rgba(107,114,128,0.15); color: var(--grey);   border: 1px solid var(--grey); }

    /* Severity cell (VulnDB) */
    .sev-CRITICAL { color: var(--red); font-weight: bold; }
    .sev-HIGH     { color: var(--orange); font-weight: bold; }
    .sev-MEDIUM   { color: var(--yellow); font-weight: bold; }
    .sev-PATCHED  { color: var(--grey); }

    /* Loading / error */
    .loading-msg { color: var(--text-dim); font-size: 12px; padding: 12px 0; }
    .error-msg   { color: var(--red);      font-size: 12px; padding: 8px 12px;
                   background: rgba(248,113,113,0.08); border: 1px solid var(--red);
                   border-radius: var(--radius); margin: 8px 0; }
    .success-msg { color: var(--accent);   font-size: 12px; padding: 8px 12px;
                   background: rgba(74,222,128,0.08); border: 1px solid var(--accent);
                   border-radius: var(--radius); margin: 8px 0; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* Scrollable table wrapper */
    .table-wrap {
      flex: 1;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* ===== SCANNER ===== */
    #scan-shodan-row { margin-bottom: 8px; }

    /* ===== CHAT ===== */
    #chat-panel {
      gap: 0;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
    }
    .msg-bubble {
      max-width: 72%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg-user {
      align-self: flex-end;
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .msg-ai {
      align-self: flex-start;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }
    .msg-ai code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 4px;
      font-size: 12px;
    }
    .msg-thinking { color: var(--text-dim); font-style: italic; }
    #chat-input-row { display: flex; gap: 8px; flex-shrink: 0; }
    #chat-input { flex: 1; }

    /* ===== SETTINGS ===== */
    #settings-panel { gap: 12px; }
    .settings-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-row label { font-size: 12px; color: var(--text-dim); }
    .form-row input, .form-row select, .form-row textarea { width: 100%; }
    .radio-group { display: flex; gap: 16px; }
    .radio-group label { display: flex; align-items: center; gap: 5px; color: var(--text); cursor: pointer; }

    /* ===== ALTS ===== */
    #alts-panel { gap: 12px; }
    #current-account-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      flex-shrink: 0;
    }
    #current-account-banner .account-name { color: var(--accent); font-weight: bold; }
    .add-alt-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      flex-shrink: 0;
    }
    .add-alt-section .form-row { margin-bottom: 8px; }
    .add-alt-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .add-alt-row .form-row { flex: 1; min-width: 140px; }

    /* ===== VULNDB ===== */
    #vulndb-panel { gap: 10px; }
    #vulndb-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
    #vulndb-controls input { flex: 1; min-width: 200px; }
    #vulndb-entry-count { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
    .vulndb-desc { max-width: 320px; white-space: pre-wrap; }
  </style>
</head>
<body>
<div id="app">

  <!-- ===== HEADER ===== -->
  <header id="header">
    <div id="status-dot" title="Server status"></div>
    <h1>ClaudeMC Companion</h1>
  </header>

  <!-- ===== TAB STRIP ===== -->
  <nav id="tab-strip" role="tablist">
    <button class="tab-btn active" data-tab="scanner" role="tab">Scanner</button>
    <button class="tab-btn"        data-tab="chat"    role="tab">Chat</button>
    <button class="tab-btn"        data-tab="settings"role="tab">Settings</button>
    <button class="tab-btn"        data-tab="alts"    role="tab">Alts</button>
    <button class="tab-btn"        data-tab="vulndb"  role="tab">VulnDb</button>
  </nav>

  <!-- ===== TAB CONTENT ===== -->
  <div id="tab-content">

    <!-- ====================================================
         TAB 1 — SCANNER
         ==================================================== -->
    <section class="tab-panel active" id="panel-scanner">

      <!-- MCScans filter row -->
      <div class="filter-row">
        <label>Software:
          <select id="scan-software">
            <option value="">All</option>
            <option value="paper">paper</option>
            <option value="spigot">spigot</option>
            <option value="bungeecord">bungeecord</option>
            <option value="velocity">velocity</option>
            <option value="craftbukkit">craftbukkit</option>
            <option value="mohist">mohist</option>
            <option value="magma">magma</option>
          </select>
        </label>
        <label>Auth Mode:
          <select id="scan-auth">
            <option value="">Any</option>
            <option value="offline">Offline</option>
            <option value="online">Online</option>
          </select>
        </label>
        <label>Max Results:
          <input type="number" id="scan-max" value="50" min="1" max="500" style="width:70px" />
        </label>
        <label style="display:flex;align-items:center;gap:5px">
          <input type="checkbox" id="scan-shodan" />
          Include Shodan
        </label>
        <button class="btn btn-primary" id="btn-scan">&#128269; Scan MCScans</button>
      </div>

      <!-- Shodan direct-search row -->
      <div class="filter-row" id="scan-shodan-row">
        <input type="text" id="shodan-query" placeholder='Shodan query, e.g. "port:25565 minecraft 1.21"' style="flex:1;min-width:260px" />
        <button class="btn btn-secondary" id="btn-shodan">&#128270; Shodan Search</button>
      </div>

      <!-- Status bar -->
      <div class="status-bar" id="scan-status"></div>

      <!-- Loading / error -->
      <div id="scan-loading" class="loading-msg" style="display:none"><span class="spinner"></span>Scanning…</div>
      <div id="scan-error"   class="error-msg"   style="display:none"></div>

      <!-- Results table -->
      <div class="table-wrap">
        <table class="results-table" id="scan-table">
          <thead>
            <tr>
              <th>IP : Port</th>
              <th>Software</th>
              <th>Version</th>
              <th>Players</th>
              <th>Auth</th>
              <th>Vulnerabilities</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="scan-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ====================================================
         TAB 2 — CHAT
         ==================================================== -->
    <section class="tab-panel" id="panel-chat" style="display:none">
      <!-- Message history -->
      <div id="chat-messages"></div>
      <!-- Error -->
      <div id="chat-error" class="error-msg" style="display:none"></div>
      <!-- Input row -->
      <div id="chat-input-row">
        <input type="text" id="chat-input" placeholder="Ask Claude anything about Minecraft hacking…" />
        <button class="btn btn-primary" id="btn-chat-send">Send</button>
      </div>
    </section>

    <!-- ====================================================
         TAB 3 — SETTINGS
         ==================================================== -->
    <section class="tab-panel" id="panel-settings" style="display:none">
      <div id="settings-loading" class="loading-msg" style="display:none"><span class="spinner"></span>Loading settings…</div>
      <div id="settings-feedback"></div>
      <form class="settings-form" id="settings-form" onsubmit="return false">
        <div class="form-row">
          <label>AI Provider</label>
          <div class="radio-group">
            <label><input type="radio" name="provider" value="anthropic" checked /> Anthropic</label>
            <label><input type="radio" name="provider" value="openai"    /> OpenAI</label>
            <label><input type="radio" name="provider" value="gemini"    /> Gemini</label>
          </div>
        </div>
        <div class="form-row">
          <label for="key-anthropic">Anthropic API Key</label>
          <input type="password" id="key-anthropic" placeholder="sk-ant-…" />
        </div>
        <div class="form-row">
          <label for="key-openai">OpenAI API Key</label>
          <input type="password" id="key-openai" placeholder="sk-…" />
        </div>
        <div class="form-row">
          <label for="key-gemini">Gemini API Key</label>
          <input type="password" id="key-gemini" placeholder="AIza…" />
        </div>
        <div class="form-row">
          <label for="key-shodan">Shodan API Key</label>
          <input type="password" id="key-shodan" placeholder="Your Shodan key" />
        </div>
        <div class="form-row">
          <label for="setting-model">Model <span style="color:var(--text-dim)">(leave blank for default)</span></label>
          <input type="text" id="setting-model" placeholder="e.g. claude-3-5-sonnet-20241022" />
        </div>
        <div class="form-row">
          <label for="setting-maxtokens">Max Tokens</label>
          <input type="number" id="setting-maxtokens" placeholder="4096" min="1" style="width:120px" />
        </div>
        <div class="form-row">
          <label for="setting-sysprompt">System Prompt</label>
          <textarea id="setting-sysprompt" rows="5" placeholder="You are…"></textarea>
        </div>
        <div>
          <button class="btn btn-primary" id="btn-save-settings">Save Settings</button>
        </div>
      </form>
    </section>

    <!-- ====================================================
         TAB 4 — ALTS
         ==================================================== -->
    <section class="tab-panel" id="panel-alts" style="display:none">
      <!-- Current account -->
      <div id="current-account-banner">
        Playing as: <span class="account-name" id="current-username">…</span>
        <button class="btn btn-ghost btn-sm" id="btn-restore-alt" style="display:none">Restore</button>
      </div>

      <div id="alts-loading" class="loading-msg" style="display:none"><span class="spinner"></span>Loading alts…</div>
      <div id="alts-error"   class="error-msg"   style="display:none"></div>
      <div id="alts-feedback" ></div>

      <!-- Alts list -->
      <div class="table-wrap" style="flex:unset;max-height:240px;margin-top:8px">
        <table class="results-table" id="alts-table">
          <thead>
            <tr><th>Name</th><th>Type</th><th>Actions</th></tr>
          </thead>
          <tbody id="alts-tbody"></tbody>
        </table>
      </div>

      <!-- Add Offline Alt -->
      <div class="add-alt-section" style="margin-top:12px">
        <div class="section-title">Add Offline Alt</div>
        <div class="add-alt-row">
          <div class="form-row">
            <label>Username</label>
            <input type="text" id="add-offline-name" placeholder="CoolPlayer123" />
          </div>
          <button class="btn btn-primary btn-sm" id="btn-add-offline" style="align-self:flex-end;margin-bottom:4px">Add</button>
        </div>
      </div>

      <!-- Add Session Alt -->
      <div class="add-alt-section" style="margin-top:10px">
        <div class="section-title">Add Session Alt</div>
        <div class="add-alt-row">
          <div class="form-row">
            <label>Username</label>
            <input type="text" id="add-session-name" placeholder="PremiumPlayer" />
          </div>
          <div class="form-row">
            <label>UUID</label>
            <input type="text" id="add-session-uuid" placeholder="xxxxxxxx-xxxx-…" />
          </div>
          <div class="form-row">
            <label>Access Token</label>
            <input type="text" id="add-session-token" placeholder="eyJ…" />
          </div>
          <button class="btn btn-primary btn-sm" id="btn-add-session" style="align-self:flex-end;margin-bottom:4px">Add</button>
        </div>
      </div>
    </section>

    <!-- ====================================================
         TAB 5 — VULNDB
         ==================================================== -->
    <section class="tab-panel" id="panel-vulndb" style="display:none">
      <!-- Controls row -->
      <div id="vulndb-controls">
        <input type="text"  id="vulndb-search"   placeholder="Search plugin name or description…" />
        <label>Severity:
          <select id="vulndb-sev-filter">
            <option value="">All</option>
            <option value="CRITICAL">CRITICAL</option>
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="PATCHED">PATCHED</option>
          </select>
        </label>
        <span id="vulndb-entry-count"></span>
      </div>

      <div id="vulndb-loading" class="loading-msg" style="display:none"><span class="spinner"></span>Loading vulnerability database…</div>
      <div id="vulndb-error"   class="error-msg"   style="display:none"></div>

      <div class="table-wrap">
        <table class="results-table" id="vulndb-table">
          <thead>
            <tr>
              <th>Plugin</th>
              <th>Severity</th>
              <th>Affected Versions</th>
              <th>Description</th>
              <th>Patched In</th>
            </tr>
          </thead>
          <tbody id="vulndb-tbody"></tbody>
        </table>
      </div>
    </section>

  </div><!-- #tab-content -->
</div><!-- #app -->

<script>
/* ============================================================
   ClaudeMC Companion — companion.html
   Pure vanilla JS, no external dependencies.
   All /api/* calls go to the embedded Java HTTP server on localhost:8080.
   ============================================================ */

'use strict';

// ── Utility helpers ─────────────────────────────────────────

/**
 * Make a fetch() call and return parsed JSON.
 * Returns { data, error } — always safe to destructure.
 */
async function apiFetch(path, options = {}) {
  try {
    const res = await fetch(path, {
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
      ...options,
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    if (!res.ok) return { data: null, error: `HTTP ${res.status}: ${data?.message || text}` };
    return { data, error: null };
  } catch (err) {
    return { data: null, error: `Network error: ${err.message}` };
  }
}

/** Escape HTML special characters to prevent XSS. */
function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/** Very simple markdown renderer for bold, inline-code, and newlines. */
function renderMarkdown(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

/** Show / hide a loading element. */
function setLoading(id, visible) {
  document.getElementById(id).style.display = visible ? '' : 'none';
}

/** Show an error message inside an element. */
function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? '' : 'none';
}

/** Show feedback (success or error) in a container element. */
function showFeedback(id, msg, isError = false) {
  const el = document.getElementById(id);
  el.className = isError ? 'error-msg' : 'success-msg';
  el.textContent = msg;
  el.style.display = '';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = 'none'; }, 4000);
}

const TAB_OPEN_HOOKS = {}; // tabName → function called first time tab opens

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    const isActive = p.id === `panel-${name}`;
    p.classList.toggle('active', isActive);
    p.style.display = isActive ? 'flex' : 'none';
  });
  if (TAB_OPEN_HOOKS[name]) {
    TAB_OPEN_HOOKS[name]();
    delete TAB_OPEN_HOOKS[name]; // run only once
  }
}

const scanTbody    = document.getElementById('scan-tbody');
const scanStatus   = document.getElementById('scan-status');
let   scanRowCount = 0; // total rows
let   scanVulnCount = 0; // rows with ≥1 vuln

/** Build vulnerability badge HTML from an array of severity strings. */
function buildBadges(vulns) {
  if (!vulns || vulns.length === 0) return '<span style="color:var(--text-dim)">—</span>';
  return vulns.map(v => `<span class="badge badge-${esc(v)}">${esc(v)}</span>`).join('');
}

/**
 * Insert or toggle an expanded detail row beneath a scanner result row.
 * @param {HTMLTableRowElement} parentRow
 * @param {string} htmlContent
 * @param {boolean} [forceOpen] - if true always open, if false always close
 */
function toggleExpandedRow(parentRow, htmlContent, forceOpen) {
  const existingNext = parentRow.nextElementSibling;
  if (existingNext && existingNext.classList.contains('expanded-row')) {
    if (forceOpen === true) {
      existingNext.querySelector('td').innerHTML = htmlContent;
      return;
    }
    existingNext.remove();
    return;
  }
  const tr = document.createElement('tr');
  tr.className = 'expanded-row';
  const td = document.createElement('td');
  td.colSpan = 7;
  td.innerHTML = htmlContent;
  tr.appendChild(td);
  parentRow.insertAdjacentElement('afterend', tr);
}

/** Render a single server result row and return the <tr> element. */
function buildScanRow(server) {
  const tr = document.createElement('tr');
  const addr = esc(`${server.ip || ''}:${server.port || ''}`);
  const vulns = Array.isArray(server.vulnerabilities) ? server.vulnerabilities : [];

  tr.innerHTML = `
    <td><code>${addr}</code></td>
    <td>${esc(server.software || '—')}</td>
    <td>${esc(server.version  || '—')}</td>
    <td>${esc(server.players  !== undefined ? server.players : '—')}</td>
    <td>${esc(server.auth     || '—')}</td>
    <td>${buildBadges(vulns)}</td>
    <td>
      <button class="btn btn-ghost btn-sm" data-action="copy">&#128203; Copy IP</button>
      <button class="btn btn-ghost btn-sm" data-action="enrich">&#128269; Enrich</button>
      <button class="btn btn-secondary btn-sm" data-action="analyze">&#129302; Analyze</button>
    </td>`;

  // Copy IP button
  tr.querySelector('[data-action="copy"]').addEventListener('click', () => {
    const raw = `${server.ip || ''}:${server.port || ''}`;
    navigator.clipboard.writeText(raw).catch(() => {});
  });

  // Enrich button
  tr.querySelector('[data-action="enrich"]').addEventListener('click', async () => {
    const address = `${server.ip}:${server.port}`;
    toggleExpandedRow(tr, `<div class="expanded-content"><span class="spinner"></span> Loading enrichment…</div>`, true);
    const { data, error } = await apiFetch(`/api/lookup?address=${encodeURIComponent(address)}`);
    if (error) {
      toggleExpandedRow(tr, `<div class="expanded-content"><span style="color:var(--red)">${esc(error)}</span></div>`, true);
      return;
    }
    // Render MOTD, plugins, and online players
    const motd     = data.motd       ? `<p><strong>MOTD:</strong> ${esc(data.motd)}</p>` : '';
    const plugins  = Array.isArray(data.plugins) && data.plugins.length
      ? `<p><strong>Plugins (${data.plugins.length}):</strong> ${data.plugins.map(esc).join(', ')}</p>` : '';
    const players  = Array.isArray(data.onlinePlayers) && data.onlinePlayers.length
      ? `<p><strong>Online Players:</strong> ${data.onlinePlayers.map(esc).join(', ')}</p>` : '';
    const raw      = `<details><summary style="cursor:pointer;color:var(--text-dim)">Raw JSON</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
    toggleExpandedRow(tr, `<div class="expanded-content"><h4>Enrichment — ${esc(address)}</h4>${motd}${plugins}${players}${raw}</div>`, true);
  });

  // Analyze button
  tr.querySelector('[data-action="analyze"]').addEventListener('click', async () => {
    toggleExpandedRow(tr, `<div class="expanded-content"><span class="spinner"></span> Running AI analysis…</div>`, true);
    const { data, error } = await apiFetch('/api/analyze', {
      method: 'POST',
      body: JSON.stringify({
        ip:      server.ip,
        port:    server.port,
        software:server.software,
        version: server.version,
        plugins: server.plugins || [],
      }),
    });
    if (error) {
      toggleExpandedRow(tr, `<div class="expanded-content"><span style="color:var(--red)">${esc(error)}</span></div>`, true);
      return;
    }
    const analysis = data.analysis || data.reply || JSON.stringify(data);
    toggleExpandedRow(tr, `<div class="expanded-content"><h4>AI Exploit Analysis</h4><pre>${esc(analysis)}</pre></div>`, true);
  });

  return tr;
}

/** Populate the scanner results table from an array of server objects. */
function populateScanResults(servers) {
  scanTbody.innerHTML = '';
  scanRowCount  = servers.length;
  scanVulnCount = servers.filter(s => s.vulnerabilities && s.vulnerabilities.length > 0).length;
  servers.forEach(s => scanTbody.appendChild(buildScanRow(s)));
  scanStatus.innerHTML =
    `<span class="hl">${scanRowCount}</span> servers found — ` +
    `<span class="vuln-hl">${scanVulnCount}</span> vulnerable`;
}

// MCScans scan button
document.getElementById('btn-scan').addEventListener('click', async () => {
  const btn = document.getElementById('btn-scan');
  btn.disabled = true;
  setLoading('scan-loading', true);
  showError('scan-error', '');
  scanStatus.textContent = '';

  const { data, error } = await apiFetch('/api/scan', {

      software:      document.getElementById('scan-software').value,
      authMode:      document.getElementById('scan-auth').value,
      maxResults:    parseInt(document.getElementById('scan-max').value) || 50,

// ============================================================

const chatMessages = document.getElementById('chat-messages');
const chatInput    = document.getElementById('chat-input');

/** Append a bubble to the chat history. Returns the new element. */
function appendChatBubble(text, role) {
  const div = document.createElement('div');
  div.className = `msg-bubble msg-${role}`;
  if (role === 'ai') {
    div.innerHTML = renderMarkdown(text);
  } else {
    div.textContent = text;
  }
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

async function sendChat() {
  const msg = chatInput.value.trim();
  if (!msg) return;
  chatInput.value = '';
  showError('chat-error', '');

  appendChatBubble(msg, 'user');

  // Thinking placeholder
  const thinking = appendChatBubble('thinking…', 'ai');
  thinking.classList.add('msg-thinking');

  const btn = document.getElementById('btn-chat-send');
  btn.disabled = true;
  chatInput.disabled = true;

  const { data, error } = await apiFetch('/api/chat', {
    method: 'POST',
    body: JSON.stringify({ message: msg }),
  });

  thinking.remove();
  btn.disabled = false;
  chatInput.disabled = false;
  chatInput.focus();

  if (error) { showError('chat-error', error); return; }
  appendChatBubble(data.reply || JSON.stringify(data), 'ai');
}

document.getElementById('btn-chat-send').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendChat(); });

/** Load settings from the server and populate the form. */
async function loadSettings() {
  setLoading('settings-loading', true);
  const { data, error } = await apiFetch('/api/settings');
  setLoading('settings-loading', false);

  if (error) { showFeedback('settings-feedback', `Failed to load settings: ${error}`, true); return; }
  if (!data)  return;

  // Provider radio
  const providerRadio = document.querySelector(`input[name="provider"][value="${data.provider}"]`);
  if (providerRadio) providerRadio.checked = true;

  // Keys
  if (data.anthropicKey)  document.getElementById('key-anthropic').value  = data.anthropicKey;
  if (data.openaiKey)     document.getElementById('key-openai').value     = data.openaiKey;
  if (data.geminiKey)     document.getElementById('key-gemini').value     = data.geminiKey;
  if (data.shodanKey)     document.getElementById('key-shodan').value     = data.shodanKey;
  if (data.model)         document.getElementById('setting-model').value  = data.model;
  if (data.maxTokens)     document.getElementById('setting-maxtokens').value = data.maxTokens;
  if (data.systemPrompt)  document.getElementById('setting-sysprompt').value = data.systemPrompt;
}

// Load settings the first time the tab is opened
TAB_OPEN_HOOKS['settings'] = loadSettings;

document.getElementById('btn-save-settings').addEventListener('click', async () => {
  const btn = document.getElementById('btn-save-settings');
  btn.disabled = true;

  const providerEl = document.querySelector('input[name="provider"]:checked');
  const payload = {
    provider:     providerEl ? providerEl.value : 'anthropic',
    anthropicKey: document.getElementById('key-anthropic').value,
    openaiKey:    document.getElementById('key-openai').value,
    geminiKey:    document.getElementById('key-gemini').value,
    shodanKey:    document.getElementById('key-shodan').value,
    model:        document.getElementById('setting-model').value,
    maxTokens:    parseInt(document.getElementById('setting-maxtokens').value) || null,
    systemPrompt: document.getElementById('setting-sysprompt').value,
  };

  const { error } = await apiFetch('/api/settings', {
    method: 'POST',
    body: JSON.stringify(payload),
  });

  btn.disabled = false;
  showFeedback('settings-feedback', error ? `✗ Error: ${error}` : '✓ Saved', !!error);
});

/** Load alt list and current account from the server. */
async function loadAlts() {
  setLoading('alts-loading', true);
  showError('alts-error', '');
  const { data, error } = await apiFetch('/api/alts');
  setLoading('alts-loading', false);

  if (error) { showError('alts-error', error); return; }

  // Current account
  const currentName = data.current || 'Unknown';
  const isAlt = !!data.usingAlt;
  document.getElementById('current-username').textContent = currentName;
  document.getElementById('btn-restore-alt').style.display = isAlt ? '' : 'none';

  // Render alts list
  const tbody = document.getElementById('alts-tbody');
  tbody.innerHTML = '';
  const alts = Array.isArray(data.alts) ? data.alts : [];
  if (alts.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="color:var(--text-dim);text-align:center">No saved alts</td></tr>';
    return;
  }
  alts.forEach((alt, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(alt.name || '—')}</td>
      <td>${esc(alt.type || '—')}</td>
      <td>
        <button class="btn btn-primary btn-sm" data-action="switch" data-idx="${idx}">Switch</button>
        <button class="btn btn-danger  btn-sm" data-action="delete" data-idx="${idx}">Delete</button>
      </td>`;
    tr.querySelector('[data-action="switch"]').addEventListener('click', () => switchAlt(idx));
    tr.querySelector('[data-action="delete"]').addEventListener('click', () => deleteAlt(idx));
    tbody.appendChild(tr);
  });
}

async function switchAlt(index) {
  const { error } = await apiFetch('/api/alts/switch', {
    method: 'POST',
    body: JSON.stringify({ index }),
  });
  if (error) { showFeedback('alts-feedback', `✗ ${error}`, true); return; }
  showFeedback('alts-feedback', '✓ Switched account');
  loadAlts();
}

async function deleteAlt(index) {
  if (!confirm('Delete this alt?')) return;
  const { error } = await apiFetch(`/api/alts?index=${index}`, { method: 'DELETE' });
  if (error) { showFeedback('alts-feedback', `✗ ${error}`, true); return; }
  showFeedback('alts-feedback', '✓ Alt deleted');
  loadAlts();
}

document.getElementById('btn-restore-alt').addEventListener('click', async () => {
  const { error } = await apiFetch('/api/alts/restore', { method: 'POST' });
  if (error) { showFeedback('alts-feedback', `✗ ${error}`, true); return; }
  showFeedback('alts-feedback', '✓ Restored original account');
  loadAlts();
});

document.getElementById('btn-add-offline').addEventListener('click', async () => {
  const name = document.getElementById('add-offline-name').value.trim();
  if (!name) return;
  const { error } = await apiFetch('/api/alts', {
    method: 'POST',
    body: JSON.stringify({ type: 'offline', name }),
  });
  if (error) { showFeedback('alts-feedback', `✗ ${error}`, true); return; }
  document.getElementById('add-offline-name').value = '';
  showFeedback('alts-feedback', `✓ Offline alt "${name}" added`);
  loadAlts();
});

document.getElementById('btn-add-session').addEventListener('click', async () => {
  const name  = document.getElementById('add-session-name').value.trim();
  const uuid  = document.getElementById('add-session-uuid').value.trim();
  const token = document.getElementById('add-session-token').value.trim();
  if (!name || !uuid || !token) {
    showFeedback('alts-feedback', '✗ All session fields are required', true);
    return;
  }
  const { error } = await apiFetch('/api/alts', {
    method: 'POST',
    body: JSON.stringify({ type: 'session', name, uuid, accessToken: token }),
  });
  if (error) { showFeedback('alts-feedback', `✗ ${error}`, true); return; }
  document.getElementById('add-session-name').value  = '';
  document.getElementById('add-session-uuid').value  = '';
  document.getElementById('add-session-token').value = '';
  showFeedback('alts-feedback', `✓ Session alt "${name}" added`);
  loadAlts();
});

// Load alts the first time the tab is opened
TAB_OPEN_HOOKS['alts'] = loadAlts;

//  TAB 5 — VULNDB
// ============================================================

let vulnDbData = []; // full data set

/** Filter and render the VulnDB table based on current search + severity filter. */
function renderVulnDb() {
  const query  = document.getElementById('vulndb-search').value.toLowerCase();
  const sev    = document.getElementById('vulndb-sev-filter').value;
  const tbody  = document.getElementById('vulndb-tbody');
  tbody.innerHTML = '';

  const filtered = vulnDbData.filter(entry => {
    const matchesSev  = !sev  || entry.severity === sev;
    const matchesText = !query ||
      (entry.plugin      || '').toLowerCase().includes(query) ||
      (entry.description || '').toLowerCase().includes(query);
    return matchesSev && matchesText;
  });

  document.getElementById('vulndb-entry-count').textContent =
    `${filtered.length} of ${vulnDbData.length} entries`;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:var(--text-dim);text-align:center">No entries match the filter</td></tr>';
    return;
  }

  filtered.forEach(entry => {
    const tr = document.createElement('tr');
    const sevClass = `sev-${esc(entry.severity || 'PATCHED')}`;
    tr.innerHTML = `
      <td><strong>${esc(entry.plugin || '—')}</strong></td>
      <td class="${sevClass}">${esc(entry.severity || '—')}</td>
      <td>${esc(entry.affectedVersions || '—')}</td>
      <td class="vulndb-desc">${esc(entry.description || '—')}</td>
      <td>${esc(entry.patchedIn || '—')}</td>`;
    tbody.appendChild(tr);
  });
}

/** Fetch VulnDB from the server and populate. */
async function loadVulnDb() {
  setLoading('vulndb-loading', true);
  showError('vulndb-error', '');
  document.getElementById('vulndb-entry-count').textContent = '';

  const { data, error } = await apiFetch('/api/vulndb');
  setLoading('vulndb-loading', false);

  if (error) { showError('vulndb-error', error); return; }
  vulnDbData = Array.isArray(data) ? data : data.entries || [];
  renderVulnDb();
}

document.getElementById('vulndb-search').addEventListener('input', renderVulnDb);
document.getElementById('vulndb-sev-filter').addEventListener('change', renderVulnDb);

// Load VulnDB the first time the tab is opened
TAB_OPEN_HOOKS['vulndb'] = loadVulnDb;
