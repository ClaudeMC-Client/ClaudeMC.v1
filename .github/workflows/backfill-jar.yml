name: Backfill JAR for existing release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to attach JAR to (e.g. v1.4)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    name: Build and attach JAR to ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/serene-volta-eY5Oe
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Stamp version into gradle.properties
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Strip leading 'v' and append .0 if needed (v1.4 → 1.4.0)
          SEMVER="${VERSION#v}"
          if [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+$ ]]; then
            SEMVER="${SEMVER}.0"
          fi
          sed -i "s/^mod_version=.*/mod_version=${SEMVER}/" gradle.properties
          echo "Building mod version: ${SEMVER} for release tag: ${VERSION}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod JAR
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Find built JAR
        id: jar
        run: |
          JAR=$(ls build/libs/claudemc-*.jar | grep -v sources | head -1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR"

      - name: Upload JAR to existing release
        run: |
          TAG="${{ github.event.inputs.version }}"
          JAR="${{ steps.jar.outputs.path }}"
          echo "Uploading $JAR to release $TAG"
          gh release upload "$TAG" "$JAR" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
