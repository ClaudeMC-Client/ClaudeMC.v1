name: Auto Release

on:
  push:
    branches:
      - claude/serene-volta-eY5Oe
    paths:
      - 'VERSION'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and release version in VERSION file
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          VERSION="v$(cat VERSION | tr -d '[:space:]')"
          MC_VER=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  MC: $MC_VER"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod JAR
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Find built JAR
        id: jar
        run: |
          JAR=$(ls build/libs/claudemc-*.jar | grep -v sources | head -1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR"

      - name: Create and push tag
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release notes
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          MC_VER="${{ steps.ver.outputs.mc_version }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" /tmp/release_body.md
          else
            echo "## ClaudeMC $TAG [MC $MC_VER]" > /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            echo "**Minecraft:** $MC_VER · **Fabric Loader:** 0.19.3+ · **Fabric API:** 0.141.4+1.21.11 · **Java:** 21" >> /tmp/release_body.md
          fi

      - name: Create GitHub Release (with JAR)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "ClaudeMC ${{ steps.ver.outputs.tag }} [MC ${{ steps.ver.outputs.mc_version }}]"
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
          files: ${{ steps.jar.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
