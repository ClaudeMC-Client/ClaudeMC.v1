name: Auto Release

on:
  push:
    branches:
      - claude/serene-volta-eY5Oe
    paths:
      - 'VERSION'

permissions:
  contents: write

jobs:
  release:
    name: Create release for version in VERSION file
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Read version
        id: ver
        run: |
          VERSION="v$(cat VERSION | tr -d '[:space:]')"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Create and push tag
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          # Only create if it doesn't already exist
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping tag creation."
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release notes
        id: notes
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" /tmp/release_body.md
          else
            echo "## ClaudeMC $TAG" > /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            echo "**Minecraft:** 1.21.1 · **Fabric Loader:** 0.16.5 · **Fabric API:** 0.100.7+1.21.1 · **Java:** 21" >> /tmp/release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "ClaudeMC ${{ steps.ver.outputs.tag }}"
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
